# shellcheck shell=bash
# Settings for install.sh / uninstall.sh of omarchy-shared-config.
REPO_NAME=omarchy-shared-config

# shell.json is Timon's live file (only backed up); shell.d holds non-bar settings.
EXTRA_BACKUP=(
  .config/omarchy/shell.json
  .config/hypr/hyprsunset.conf
  .config/mimeapps.list
  .config/omarchy/extensions/omarchy-menu.jsonc
  .config/brave-flags.conf
)

# Old pieces this repo replaces or that were dropped everywhere
# (backed up first, restored by uninstall.sh).
REMOVE_PATHS=(
  .config/omarchy/plugins/timon.power
  # Grokbar became timon.grok-usage (github.com/roehrbacher/omarchy-grok-usage).
  .config/omarchy/plugins/pixbroker.grokbar-omarchy
  # Running Cat, removed 2026-10-16.
  .config/omarchy/plugins/io.github.kaiizu.runcat
  # Insomnia used to be its own widget; it is now part of timon.indicators.
  .config/omarchy/plugins/timon.insomnia
  .config/omarchy/plugins/timon.bar
  # Performance alarm, dropped on both machines.
  .config/omarchy/plugins/timon.perf-alarm
  .config/omarchy/timon.perf-alarm.json
  .config/omarchy/hooks/post-boot.d/10-timezone-auto
  .config/omarchy/hooks/post-boot.d/20-nightlight-sun-schedule
  # Hand-made Drive launcher on the XPS, replaced by the shared Proton Drive one.
  ".local/share/applications/Drive Proton.desktop"
  .local/share/icons/hicolor/256x256/apps/drive-proton.png
)

# Extra apps on both machines. install.sh installs only the missing ones
# (pacman --needed, AUR via yay), never upgrades or removes anything;
# uninstall.sh leaves them installed. Trim this list for your own machine.
PACKAGES=(
  bitwarden
  bitwarden-cli
  brave-bin
  cursor-bin
  ente-desktop-bin   # AUR
  firefox
  fwupd
  gitleaks           # needed by the pre-commit hook
  python-icalendar   # Proton Calendar sync (else a private venv)
  python-recurring-ical-events  # AUR
  grok-bot
  hermes-desktop
  minecraft-launcher
  python-scipy
  signal-desktop
  spotify
  steam
  tailscale
  telegram-desktop
  voxtype-bin
)

SERVICES=(
  audio-passthrough.service
  mpris-exclusive.service
  nightlight-sun-schedule.timer
  omarchy-timezone-auto.timer
  omarchy-timezone-auto-watch.service
  omarchy-menu-build.path
  omarchy-menu-build.timer
  omarchy-proton-calendar.timer   # Proton Calendar ICS -> clock popup
  # Laptop parts of Insomnia; both are no-ops on a desktop.
  omarchy-lowbat-saver.service
  omarchy-lid-quiet-thaw.service
)

# Themes: installed on both machines if missing (at the code-reviewed commit;
# the weekly plugin check reviews and bumps them), but NEVER applied.
# Switching themes is always manual (theme menu).
# Format: "dir repo reviewed-commit"
THEMES=(
  "theme-liftoff https://github.com/tcballard/omarchy-theme-liftoff dba3c70"
  "theme-tokyo-roadster https://github.com/tcballard/omarchy-theme-tokyo-roadster 3124da3"
)

# Lumo/Grok summarize Brave extensions (code lives in their own repos, owned
# elsewhere; never changed here). Cloned into ~/Work if missing, fast-forwarded
# when the clone is clean and on its default branch; loaded unpacked through
# brave-flags.d/00-shared.conf. Private repos: needs `gh auth login`.
# Format: "dir repo"
SUMMARIZE_EXTENSIONS=(
  "lumo-summarize-extension https://github.com/roehrbacher/lumo-summarize-extension.git"
  "grok-summarize-extension https://github.com/roehrbacher/grok-summarize-extension.git"
)

sync_summarize_extensions() {
  local entry dir repo edir before branch head
  for entry in "${SUMMARIZE_EXTENSIONS[@]}"; do
    read -r dir repo <<<"$entry"
    edir="$HOME/Work/$dir"
    if [[ ! -d $edir/.git ]]; then
      if [[ -e $edir ]]; then echo "$edir exists but is not a git clone, leaving it"; continue; fi
      mkdir -p "$HOME/Work"
      echo "Cloning $dir"
      git clone -q "$repo" "$edir" || { echo "Could not clone $dir (private repo: run gh auth login)"; rm -rf "$edir"; }
      continue
    fi
    if [[ -n $(git -C "$edir" status --porcelain 2>/dev/null) ]]; then
      echo "Not updating $dir: it has local changes"; continue
    fi
    branch=$(git -C "$edir" symbolic-ref --short HEAD 2>/dev/null || true)
    head=$(git -C "$edir" symbolic-ref --short refs/remotes/origin/HEAD 2>/dev/null || echo origin/main)
    if [[ "origin/$branch" != "$head" ]]; then
      echo "Not updating $dir: on ${branch:-a detached HEAD}, not ${head#origin/}"; continue
    fi
    before=$(git -C "$edir" rev-parse HEAD)
    git -C "$edir" pull -q --ff-only || { echo "Could not fast-forward $dir"; continue; }
    [[ $(git -C "$edir" rev-parse HEAD) != "$before" ]] && echo "Updated $dir (reload it in Brave or restart Brave)"
  done
  return 0
}

# Apps built from source (not from pacman/AUR, so `omarchy update` never
# updates them). install.sh clones each into ~/Work/<name> if it is missing;
# when the checkout is not at the reviewed tag it fetches, checks the tag out,
# runs the build command in the checkout and restarts the user service (if it
# runs). Already at the tag: nothing happens, no rebuild. The app's own config
# and pairing are never touched. The weekly plugin check reviews upstream and
# bumps the tag here. Remove an entry to stop managing an app (it stays
# installed; full removal: README "Source-built apps").
# Format: "name|repo|reviewed-tag|build-cmd|user-service" (service may be empty)
SOURCE_APPS=(
  "flux|https://github.com/bjarneo/flux|v0.18.0|mise exec go@1.27.1 cmake@4.4.4 ninja@1.13.2 -- make build install-user|fluxd.service"
)

# Missing build tools: print what to install. "mise exec a@1 b@2 -- ..." needs
# those mise tools; any other command needs its first word on PATH.
source_app_tools_missing() {
  local build=$1 w words missing=()
  read -ra words <<<"$build"
  if [[ ${words[0]} == mise && ${words[1]:-} == exec ]]; then
    command -v mise >/dev/null || { echo "mise (sudo pacman -S mise)"; return 0; }
    for w in "${words[@]:2}"; do
      [[ $w == -- ]] && break
      [[ $w == *@* ]] || continue
      mise where "$w" >/dev/null 2>&1 || missing+=("$w")
    done
    (( ${#missing[@]} )) && echo "mise install ${missing[*]}"
  else
    command -v "${words[0]}" >/dev/null || echo "${words[0]}"
  fi
  return 0
}

# Flux pause of timon.clipboard: while private mode is on (or the plugin has
# stopped fluxd), never start or restart Flux. `flux-cli off` counts too.
source_app_paused() {
  [[ $1 == fluxd.service ]] || return 1
  [[ -e $HOME/.local/state/timon.clipboard/flux-paused ]] && return 0
  [[ -e $HOME/.config/flux/off ]] && return 0
  jq -e '.private == true' "$HOME/.local/share/timon.clipboard/state.json" >/dev/null 2>&1
}

sync_source_apps() {
  local entry name repo tag build service dir want have missing fresh log
  local logdir=$HOME/.local/state/omarchy-config/source-apps
  for entry in "${SOURCE_APPS[@]}"; do
    IFS='|' read -r name repo tag build service <<<"$entry"
    dir="$HOME/Work/$name"
    fresh=0
    missing=$(source_app_tools_missing "$build")
    if [[ ! -d $dir/.git ]]; then
      if [[ -e $dir ]]; then echo "$dir exists but is not a git clone, leaving $name alone"; continue; fi
      if [[ -n $missing ]]; then echo "Not installing $name: build tools missing. Install: $missing"; continue; fi
      mkdir -p "$HOME/Work"
      echo "Cloning $name"
      git -c advice.detachedHead=false clone -q "$repo" "$dir" || { echo "Could not clone $name"; rm -rf "$dir"; continue; }
      fresh=1
    fi
    if [[ -n $(git -C "$dir" status --porcelain --untracked-files=no 2>/dev/null) ]]; then
      echo "Not updating $name: $dir has local changes"; continue
    fi
    want=$(git -C "$dir" rev-parse -q --verify "refs/tags/$tag^{commit}" 2>/dev/null || true)
    have=$(git -C "$dir" rev-parse HEAD)
    (( ! fresh )) && [[ $want == "$have" ]] && continue   # already at the reviewed tag
    if [[ -n $missing ]]; then echo "Not updating $name to $tag: build tools missing. Install: $missing"; continue; fi
    if [[ -z $want ]]; then
      git -C "$dir" fetch -q --tags origin || { echo "Could not fetch $name"; continue; }
      want=$(git -C "$dir" rev-parse -q --verify "refs/tags/$tag^{commit}" 2>/dev/null || true)
      [[ -n $want ]] || { echo "$name: tag $tag not found upstream"; continue; }
    fi
    echo "Building $name $tag"
    mkdir -p "$logdir" && log=$logdir/$name-build.log
    git -C "$dir" -c advice.detachedHead=false checkout -q "$tag"
    if ! (cd "$dir" && bash -c "$build") >"$log" 2>&1; then
      echo "Build of $name $tag failed (log: $log); back to the old checkout"
      git -C "$dir" -c advice.detachedHead=false checkout -q "$have"
      continue
    fi
    [[ -n $service ]] || continue
    if source_app_paused "$service"; then
      echo "Not restarting $service: paused (clipboard private mode or flux-cli off)"
    else
      systemctl --user try-restart "$service" >/dev/null 2>&1 || echo "Could not restart $service"
    fi
  done
  return 0
}

install_theme() {
  local entry dir repo commit tdir
  for entry in "${THEMES[@]}"; do
    read -r dir repo commit <<<"$entry"
    tdir="$HOME/.config/omarchy/themes/$dir"
    [[ -d $tdir ]] && continue
    echo "Installing theme $dir @ $commit (not applied)"
    if ! { git clone -q "$repo" "$tdir" && git -C "$tdir" checkout -q "$commit"; }; then
      echo "Could not install theme $dir"
      rm -rf "$tdir"
    fi
  done
}

post_install() {
  # Voxtype config needs an absolute model path: fill in @HOME@, then restart
  # it so a changed config is picked up (only if it is running).
  [[ -f $HOME/.config/voxtype/config.toml ]] && sed -i "s|@HOME@|$HOME|g" "$HOME/.config/voxtype/config.toml"
  systemctl --user try-restart voxtype.service >/dev/null 2>&1 || true
  if command -v systemctl >/dev/null; then
    for unit in "${SERVICES[@]}"; do
      systemctl --user enable --now "$unit" >/dev/null 2>&1 || echo "Could not enable $unit"
    done
  fi
  # Pick up a changed script (exits at once on a desktop).
  systemctl --user restart omarchy-lowbat-saver.service >/dev/null 2>&1 || true
  "$HOME/.local/bin/omarchy-nightlight-sun-schedule" >/dev/null 2>&1 || true
  bash "$HOME/.config/omarchy/hooks/post-update.d/remove-hey-basecamp" || true
  "$HOME/.local/bin/omarchy-menu-build" || echo "Could not build the Omarchy menu"
  # timon.indicators = stock omarchy.indicators + Insomnia, cloned from the installed stock files.
  "$HOME/.local/bin/omarchy-indicators-build" || echo "Could not build timon.indicators"
  update-desktop-database "$HOME/.local/share/applications" >/dev/null 2>&1 || true
  gtk-update-icon-cache "$HOME/.local/share/icons/hicolor" >/dev/null 2>&1 || true
  install_theme
  sync_summarize_extensions
  sync_source_apps
  # brave-flags.conf from brave-flags.d/ (the machine repo runs this again for its 50-*.conf).
  "$HOME/.local/bin/omarchy-brave-flags-build" || echo "Could not build brave-flags.conf"

  if ! sudo -n -l 2>/dev/null | grep -q 'timedatectl'; then
    echo
    echo "Timezone switching needs this sudoers rule (Omarchy normally ships it)."
    echo "Add it with: sudo visudo -f /etc/sudoers.d/omarchy-timezone"
    echo "  $USER ALL=(root) NOPASSWD: /usr/bin/timedatectl ^set-timezone [A-Za-z0-9_+][A-Za-z0-9_+.-]*(/[A-Za-z0-9_+][A-Za-z0-9_+.-]*)*\$"
  fi
  if pacman -Q omasnap >/dev/null 2>&1; then
    echo
    echo "omasnap is still installed but no longer bound. Remove it with:"
    echo "  sudo pacman -R omasnap"
  fi
}

pre_uninstall() {
  # Source-built apps (SOURCE_APPS) stay installed and running; this repo just
  # stops managing them. Full removal: README "Source-built apps".
  local entry
  for entry in "${SOURCE_APPS[@]}"; do
    echo "Leaving ${entry%%|*} installed in ~/Work/${entry%%|*} (no longer managed)"
  done
  systemctl --user stop omarchy-insomnia.service omarchy-lid-quiet.service >/dev/null 2>&1 || true
  rm -rf "$HOME/.config/omarchy/plugins/timon.indicators"
  command -v systemctl >/dev/null || return 0
  for unit in "${SERVICES[@]}"; do
    systemctl --user disable --now "$unit" >/dev/null 2>&1 || true
  done
}
