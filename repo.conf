# shellcheck shell=bash
# Settings for install.sh / uninstall.sh of omarchy-shared-config.
REPO_NAME=omarchy-shared-config

# shell.json is generated from ~/.config/omarchy/shell.d/*.json.
EXTRA_BACKUP=(
  .config/omarchy/shell.json
  .config/hypr/hyprsunset.conf
  .config/mimeapps.list
  .config/omarchy/extensions/omarchy-menu.jsonc
)

# Old pieces this repo replaces or that were dropped everywhere
# (backed up first, restored by uninstall.sh).
REMOVE_PATHS=(
  .config/omarchy/plugins/timon.power
  # Grokbar became timon.grok-usage (github.com/roehrbacher/omarchy-grok-usage).
  .config/omarchy/plugins/pixbroker.grokbar-omarchy
  # Running Cat, removed 2026-10-16.
  .config/omarchy/plugins/io.github.kaiizu.runcat
  # Insomnia used to be its own widget; it is now part of timon.indicators.
  .config/omarchy/plugins/timon.insomnia
  .config/omarchy/plugins/timon.bar
  # Performance alarm, dropped on both machines.
  .config/omarchy/plugins/timon.perf-alarm
  .config/omarchy/timon.perf-alarm.json
  .config/omarchy/hooks/post-boot.d/10-timezone-auto
  .config/omarchy/hooks/post-boot.d/20-nightlight-sun-schedule
  # Hand-made Drive launcher on the XPS, replaced by the shared Proton Drive one.
  ".local/share/applications/Drive Proton.desktop"
  .local/share/icons/hicolor/256x256/apps/drive-proton.png
)

SERVICES=(
  audio-passthrough.service
  mpris-exclusive.service
  nightlight-sun-schedule.timer
  omarchy-timezone-auto.timer
  omarchy-timezone-auto-watch.service
  omarchy-menu-build.path
  omarchy-menu-build.timer
  # Laptop parts of Insomnia; both are no-ops on a desktop.
  omarchy-lowbat-saver.service
  omarchy-lid-quiet-thaw.service
)

# Theme for both machines: Liftoff by tcballard, pinned to the commit that was
# reviewed (colors.toml + wallpapers only; its check.py is never run).
# Installed if missing, and applied once per machine whenever THEME_DIR changes,
# so switching themes by hand afterwards is not undone by the next install.
THEME_REPO=https://github.com/tcballard/omarchy-theme-liftoff
THEME_COMMIT=942fad8
THEME_DIR=theme-liftoff

install_theme() {
  local tdir="$HOME/.config/omarchy/themes/$THEME_DIR"
  local marker="$HOME/.local/state/omarchy-config/theme-applied"
  if [[ ! -d $tdir ]]; then
    echo "Installing theme $THEME_DIR @ $THEME_COMMIT"
    if ! { git clone -q "$THEME_REPO" "$tdir" && git -C "$tdir" checkout -q "$THEME_COMMIT"; }; then
      echo "Could not install theme $THEME_DIR"
      return 0
    fi
  fi
  if [[ $(cat "$marker" 2>/dev/null) != "$THEME_DIR" ]]; then
    if omarchy-theme-set "$THEME_DIR" >/dev/null 2>&1; then
      mkdir -p "$(dirname "$marker")"
      echo "$THEME_DIR" >"$marker"
      echo "Applied theme $THEME_DIR"
    else
      echo "Could not apply theme $THEME_DIR"
    fi
  fi
}

post_install() {
  if command -v systemctl >/dev/null; then
    for unit in "${SERVICES[@]}"; do
      systemctl --user enable --now "$unit" >/dev/null 2>&1 || echo "Could not enable $unit"
    done
  fi
  # Pick up a changed script (exits at once on a desktop).
  systemctl --user restart omarchy-lowbat-saver.service >/dev/null 2>&1 || true
  "$HOME/.local/bin/omarchy-nightlight-sun-schedule" >/dev/null 2>&1 || true
  bash "$HOME/.config/omarchy/hooks/post-update.d/remove-hey-basecamp" || true
  "$HOME/.local/bin/omarchy-menu-build" || echo "Could not build the Omarchy menu"
  # timon.indicators = stock omarchy.indicators + Insomnia, cloned from the installed stock files.
  "$HOME/.local/bin/omarchy-indicators-build" || echo "Could not build timon.indicators"
  update-desktop-database "$HOME/.local/share/applications" >/dev/null 2>&1 || true
  gtk-update-icon-cache "$HOME/.local/share/icons/hicolor" >/dev/null 2>&1 || true
  install_theme

  if ! sudo -n -l 2>/dev/null | grep -q 'timedatectl'; then
    echo
    echo "Timezone switching needs this sudoers rule (Omarchy normally ships it)."
    echo "Add it with: sudo visudo -f /etc/sudoers.d/omarchy-timezone"
    echo "  $USER ALL=(root) NOPASSWD: /usr/bin/timedatectl ^set-timezone [A-Za-z0-9_+][A-Za-z0-9_+.-]*(/[A-Za-z0-9_+][A-Za-z0-9_+.-]*)*\$"
  fi
  if pacman -Q omasnap >/dev/null 2>&1; then
    echo
    echo "omasnap is still installed but no longer bound. Remove it with:"
    echo "  sudo pacman -R omasnap"
  fi
}

pre_uninstall() {
  systemctl --user stop omarchy-insomnia.service omarchy-lid-quiet.service >/dev/null 2>&1 || true
  rm -rf "$HOME/.config/omarchy/plugins/timon.indicators"
  command -v systemctl >/dev/null || return 0
  for unit in "${SERVICES[@]}"; do
    systemctl --user disable --now "$unit" >/dev/null 2>&1 || true
  done
}
