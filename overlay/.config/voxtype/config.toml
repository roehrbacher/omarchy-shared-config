# Managed by omarchy-shared-config (both machines). @HOME@ is filled in by install.sh.
# Per-machine bits live in each machine repo's voxtype.service.d drop-in
# (GPU build, Vulkan device, --flash-attention); the hotkey is bound in Hyprland.
# Voxtype Configuration
#
# Location: ~/.config/voxtype/config.toml
# All settings can be overridden via CLI flags
#
# State file for external integrations (Waybar, polybar, etc.)
# Use "auto" for default location ($XDG_RUNTIME_DIR/voxtype/state),
# a custom path, or "disabled" to turn off. The daemon writes state
# ("idle", "recording", "transcribing") to this file whenever it changes.
# Required for `voxtype record toggle` and `voxtype status` commands.
state_file = "auto"
engine = "whisper"

[hotkey]
# Hyprland owns the hotkey (PC: Context Menu, XPS: Copilot key, hold to talk).
# Keep the evdev listener off so the two paths cannot double-fire.
enabled = false

[audio]
# Audio input device ("default" uses system default)
# List devices with: pactl list sources short
device = "default"

# Sample rate in Hz (whisper expects 16000)
sample_rate = 16000

# Maximum recording duration in seconds (safety limit)
max_duration_secs = 120

# Pause MPRIS media players during recording
pause_media = false
duck_media = true
duck_media_volume_percent = 34
duck_media_fade_ms = 150

[audio.feedback]
enabled = true
theme = "subtle"
volume = 0.5

# [audio.feedback]
# Enable audio feedback sounds (beeps when recording starts/stops)
# enabled = true
#
# Sound theme: "default", "subtle", "mechanical", or path to custom theme directory
# theme = "default"
#
# Volume level (0.0 to 1.0)
# volume = 0.7

[whisper]
# Model to use for transcription
# Options: tiny, tiny.en, base, base.en, small, small.en, medium, medium.en, large-v3, large-v3-turbo
# .en models are English-only but faster and more accurate for English
# large-v3-turbo is faster than large-v3 with minimal accuracy loss (recommended for GPU)
# Or provide absolute path to a custom .bin model file
model = "@HOME@/.local/share/voxtype/models/ggml-large-v3-turbo-q5_0.bin"

# Language for transcription
# Use "en" for English, "auto" for auto-detection
# See: https://github.com/openai/whisper#available-models-and-languages
language = "en,de"

# Translate non-English speech to English
translate = false
# Vocabulary hint: Whisper leans toward these spellings. Keep it short,
# a long prompt can leak into very short recordings.
initial_prompt = "Omarchy, OmaCalc, Hyprland, Grok, Grok Bot, Grok Build, Voxtype, Timon Röhrbacher, Wardogs, Quickshell, Eichgraben, Proton, Obsidian, Tailscale, Sunshine, Moonlight, GitHub."

# Number of CPU threads for inference (omit for auto-detection)
# threads = 4

[output]
# Output mode: "paste" puts the text on the clipboard and sends ONE paste
# keystroke, instead of typing letter by letter (typed letters fired
# shortcuts when Super/Shift still counted as held, Oct 30).
mode = "paste"
# Shift+Insert pastes in terminals and in GUI apps alike (Ctrl+V does not
# paste in terminals).
paste_keys = "shift+insert"
# Put the previous clipboard contents back after pasting.
restore_clipboard = true
restore_clipboard_delay_ms = 300

# Fall back to clipboard if pasting fails
fallback_to_clipboard = true

type_delay_ms = 1
# Wait until Ctrl, Alt, Shift and Super are released before pasting. If they
# are still held after the timeout, Voxtype sends no keystroke at all: the
# text is only copied to the clipboard and a notification says so.
wait_for_modifier_release = true
modifier_release_timeout_ms = 3000

# Post-processing command (optional)
# Pipe transcribed text through an external command for cleanup before output.
# The command receives text on stdin and outputs processed text on stdout.
# Useful for LLM-based text cleanup, grammar correction, filler word removal.
# On any failure (timeout, error), falls back to original transcription.
#
# [output.post_process]
# command = "ollama run llama3.2:1b 'Clean up this dictation. Fix grammar, remove filler words. Output only the cleaned text:'"
# timeout_ms = 30000  # 30 second timeout (generous for LLM)

[output.notification]
# Show notification when recording starts (hotkey pressed)
on_recording_start = false

# Show notification when recording stops (transcription beginning)
on_recording_stop = false

# Show notification with transcribed text after transcription completes
on_transcription = false

[vad]
enabled = true
backend = "whisper"
threshold = 0.5

[text]
spoken_punctuation = true
filter_filler_words = true

# Fixes for words dictation keeps getting wrong (found in past transcripts).
# Whole-word, case-insensitive. Keep keys from overlapping each other: the
# order they are applied in is not fixed.
[text.replacements]
"omarchi" = "Omarchy"
"omarchie" = "Omarchy"
"omarchey" = "Omarchy"
"omarci" = "Omarchy"
"omarji" = "Omarchy"
"omargie" = "Omarchy"
"amarji" = "Omarchy"
"amarchi" = "Omarchy"
"marchi" = "Omarchy"
"marchie" = "Omarchy"
"oh marchy" = "Omarchy"
"o'marchy" = "Omarchy"
"omachi" = "Omarchy"
"ohmachi" = "Omarchy"
"omaki" = "Omarchy"
"oma key" = "Omarchy"
# Cleanup when "marchi"/"marchie" fired inside "oh marchie" / "a marchi"
# (replacements run twice, so these catch the leftovers).
"oh omarchy" = "Omarchy"
"a omarchy" = "Omarchy"
"omer calc" = "OmaCalc"
"oma calc" = "OmaCalc"
"grogbot" = "Grok Bot"
"grog bot" = "Grok Bot"
"vox type" = "Voxtype"
"voxtape" = "Voxtype"
"vox tape" = "Voxtype"
"tmon" = "Timon"
"war dogs" = "Wardogs"
"ibecoded" = "vibe coded"
"grock" = "Grok"
"grog build" = "Grok Build"
"hyperland" = "Hyprland"
"hyper land" = "Hyprland"
"amarkey" = "Omarchy"
"a marchy" = "Omarchy"
"quick shell" = "Quickshell"
"eichkrabben" = "Eichgraben"
"eich krabben" = "Eichgraben"
"eichgrabben" = "Eichgraben"
"eich graben" = "Eichgraben"
"aichgraben" = "Eichgraben"

[osd]
enabled = false

[parakeet]
model = "parakeet-tdt-0.6b-v3-int8"
model_type = "tdt"

# [text]
# Text processing options (word replacements, spoken punctuation)
#
# Enable spoken punctuation conversion (e.g., say "period" to get ".")
# spoken_punctuation = false
#
# Custom word replacements (case-insensitive)
# replacements = { "hyperwhisper" = "hyprwhspr" }
