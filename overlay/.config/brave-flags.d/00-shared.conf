# Managed by omarchy-shared-config. Brave flags for every machine.
# ~/.config/brave-flags.conf is built from ~/.config/brave-flags.d/*.conf by
# omarchy-brave-flags-build (run by install.sh): @HOME@ becomes your home
# folder (Brave does not expand ~ or $HOME), and all --load-extension= /
# --enable-features= lines are merged into one each (Brave only reads the last).
# Machine flags go in 50-<machine>.conf (machine repo), own ones in 90-local.conf.
--ozone-platform=wayland
--ozone-platform-hint=wayland
--password-store=gnome-libsecret
--enable-features=TouchpadOverscrollHistoryNavigation
# Omarchy's bundled extensions, then the Lumo/Grok summarize extensions
# (unpacked; cloned/updated in ~/Work by install.sh, see SUMMARIZE_EXTENSIONS).
--load-extension=/usr/share/omarchy/default/chromium/extensions/copy-url,/usr/share/omarchy/default/chromium/extensions/yt-dlp,/usr/share/omarchy/default/chromium/extensions/whatsapp-slim
--load-extension=@HOME@/Work/lumo-summarize-extension,@HOME@/Work/grok-summarize-extension
# Omarchy 4.0.5 routes links through omarchy-browser.desktop and adds this so
# Brave stops asking to be the default browser. Kept here so the flags build
# does not drop it.
--no-default-browser-check
